# Pane borders
set -g pane-border-style "fg={{colors.outline.default.hex}}"
set -g pane-active-border-style "fg={{colors.primary.default.hex}}"

# Status bar
set -g status-style "bg={{colors.surface_container.default.hex}},fg={{colors.on_surface.default.hex}}"
set -g status-left "#[fg={{colors.primary.default.hex}}]#S "
set -g status-right "#[fg={{colors.secondary.default.hex}}]%Y-%m-%d #[fg={{colors.tertiary.default.hex}}]%H:%M "

# Inactive window tabs
set -g window-status-style "bg={{colors.surface_container.default.hex}},fg={{colors.on_surface_variant.default.hex}}"
set -g window-status-format " #I:#W "

# Active window tab
set -g window-status-current-style "bg={{colors.primary.default.hex}},fg={{colors.on_primary.default.hex}},bold"
set -g window-status-current-format " #I:#W "

# Window with activity/bell
set -g window-status-activity-style "bg={{colors.error_container.default.hex}},fg={{colors.on_error_container.default.hex}}"
set -g window-status-bell-style "bg={{colors.error.default.hex}},fg={{colors.on_error.default.hex}},bold"

# Command/message line (the prompt bar when you press prefix + :)
set -g message-style "bg={{colors.surface_container_high.default.hex}},fg={{colors.on_surface.default.hex}}"
set -g message-command-style "bg={{colors.surface_container_high.default.hex}},fg={{colors.on_surface.default.hex}}"

# Copy mode selection highlight
set -g mode-style "bg={{colors.primary_container.default.hex}},fg={{colors.on_primary_container.default.hex}}"

# Clock mode (prefix + t)
set -g clock-mode-colour "{{colors.primary.default.hex}}"

# Pane number display (prefix + q)
set -g display-panes-active-colour "{{colors.primary.default.hex}}"
set -g display-panes-colour "{{colors.secondary.default.hex}}"
